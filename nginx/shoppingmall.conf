# ============================================================================
# 31-shoppingmall 로컬/개발용 Nginx 설정
#
# 역할:
#   1) shoppingmall-frontend 정적 파일(html/css/js) 서빙
#   2) /api 로 시작하는 요청만 Spring Boot(8080)로 프록시
#
# 프론트 JS가 fetch("/api/v1/...") 상대 경로를 쓰기 때문에,
# 프론트와 API가 반드시 같은 origin(이 서버, 80포트)에서 제공되어야 한다.
#
# 사용법 (macOS, brew 기준):
#   brew install nginx
#   1) 아래 root 경로를 본인 환경의 절대경로로 수정
#   2) 이 파일을 /opt/homebrew/etc/nginx/servers/shoppingmall.conf 로 복사
#      (인텔 맥은 /usr/local/etc/nginx/servers/)
#   3) nginx -t && brew services restart nginx
#   4) 브라우저에서 http://localhost 접속 (index.html이 열리면 성공)
# ============================================================================

server {
    listen 80;
    server_name localhost;

    # ⚠ 본인 환경의 프론트엔드 폴더 절대경로로 수정하세요
    root /Users/kimdongjun/31-shoppingmall/shoppingmall-frontend;
    index index.html;

    charset utf-8;

    # ---- API 프록시: /api/* → Spring Boot ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 업로드 파일 프록시 (백엔드 file.base-url: /uploads) ----
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # ---- 정적 파일 서빙 ----
    location / {
        try_files $uri $uri/ =404;
    }

    # 캐시(개발 중엔 꺼두는 게 편함)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
