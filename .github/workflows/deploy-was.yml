name: Deploy to was-01

on:
  push:
    branches:
      - main
    paths:
      - 'shoppingmall-backend-admin-v2/**'
  workflow_dispatch:  # 수동 실행 버튼도 활성화

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 빌드 (bootWar)
        working-directory: shoppingmall-backend-admin-v2/shoppingmall-backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootWar --no-daemon

      - name: 빌드 결과물 확인
        working-directory: shoppingmall-backend-admin-v2/shoppingmall-backend
        run: ls -la build/libs/

      - name: 필수 설정 파일 존재 검증 (application.yml)
        working-directory: shoppingmall-backend-admin-v2/shoppingmall-backend
        run: |
          if [ ! -f "src/main/resources/application.yml" ]; then
            echo "::error::src/main/resources/application.yml 파일이 저장소에 없습니다."
            echo "::error::이 파일이 없으면 서버가 기동되지 않습니다. .gitignore 설정을 확인하고 파일을 커밋한 뒤 다시 시도하세요."
            exit 1
          fi
          echo "application.yml 확인 완료, 배포를 진행합니다."

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 소스코드 및 빌드 산출물 백업 (S3)
        continue-on-error: true
        working-directory: shoppingmall-backend-admin-v2/shoppingmall-backend
        run: |
          git archive --format=zip -o /tmp/source-latest.zip HEAD
          aws s3 cp /tmp/source-latest.zip s3://catchcatch-backup-511529/source-backups/shoppingmall-backend/latest.zip

          WAR_FILE=$(ls build/libs/*.war | head -1)
          aws s3 cp "$WAR_FILE" s3://catchcatch-backup-511529/build-backups/shoppingmall-backend/ROOT-latest.war


      - name: SSH 배포 키 등록
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: SSH 배포 키 등록
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: EIC Endpoint 터널 오픈
        run: |
          nohup aws ec2-instance-connect open-tunnel \
            --instance-connect-endpoint-id ${{ secrets.EIC_ENDPOINT_ID }} \
            --private-ip-address ${{ secrets.WAS_PRIVATE_IP }} \
            --remote-port 22 \
            --local-port 22222 > tunnel.log 2>&1 &
          echo "터널 프로세스 PID: $!"

          echo "포트 22222 오픈 대기 중 (최대 20초)..."
          READY=false
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/localhost/22222) 2>/dev/null; then
              echo "터널 준비 완료 (${i}초)"
              READY=true
              break
            fi
            sleep 1
          done

          echo "=== tunnel.log 내용 ==="
          cat tunnel.log || true

          if [ "$READY" = false ]; then
            echo "터널이 20초 내에 준비되지 않았습니다."
            exit 1
          fi

      - name: SSH 설정 (호스트키 검증 우회, 터널 경유)
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << 'EOF'
          Host was01
            HostName localhost
            Port 22222
            User cloud-user
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: WAR 파일 was-01로 전송
        working-directory: shoppingmall-backend-admin-v2/shoppingmall-backend
        run: |
          WAR_FILE=$(ls build/libs/*.war | head -1)
          echo "전송할 파일: $WAR_FILE"
          scp -F ~/.ssh/config "$WAR_FILE" was01:/tmp/ROOT.war

      - name: was-01 배포 적용 (기존 스크립트 로직과 동일한 방식)
        run: |
          ssh -F ~/.ssh/config was01 '
            set -e
            BACKUP_FILE="/opt/tomcat/webapps/ROOT.war.bak_$(date +%Y%m%d_%H%M%S)"

            echo "=== 배포 직전 시각 기록 ==="
            DEPLOY_START=$(date "+%Y-%m-%dT%H:%M")
            echo "기준 시각: $DEPLOY_START"

            echo "=== Tomcat 중지 ==="
            sudo systemctl stop tomcat

            echo "=== 기존 WAR 백업 후 교체 ==="
            sudo cp /opt/tomcat/webapps/ROOT.war "$BACKUP_FILE" 2>/dev/null || true
            sudo rm -rf /opt/tomcat/webapps/ROOT
            sudo mv /tmp/ROOT.war /opt/tomcat/webapps/ROOT.war
            sudo chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war

            echo "=== Tomcat 재시작 ==="
            sudo systemctl start tomcat

            echo "=== 기동 대기 (최대 60초, 이번 배포 이후 로그만 확인) ==="
            STARTED=false
            for i in $(seq 1 12); do
              sleep 5
              # 배포 시작 시각 이후에 찍힌 로그에서만 검색 (예전 성공 기록 오인 방지)
              if sudo awk -v ts="$DEPLOY_START" -F"[T ]" '"'"'{ line_ts = $1"T"$2; if (line_ts >= ts) print }'"'"' /opt/tomcat/logs/catalina.out 2>/dev/null | grep -q "Started ServletInitializer"; then
                STARTED=true
                break
              fi
              echo "대기 중... ($i/12)"
            done

            if [ "$STARTED" = false ]; then
              echo "60초 내에 기동 실패. 이전 버전으로 롤백합니다."
              sudo systemctl stop tomcat
              sudo rm -rf /opt/tomcat/webapps/ROOT
              sudo cp "$BACKUP_FILE" /opt/tomcat/webapps/ROOT.war
              sudo chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war
              sudo systemctl start tomcat
              echo "롤백 완료. 최근 로그:"
              sudo tail -100 /opt/tomcat/logs/catalina.out
              exit 1
            fi

            echo "=== 최종 헬스체크 ==="
            sleep 3
            if curl -sf http://localhost:8080/api/v1/banners -o /dev/null; then
              echo "배포 성공: API 정상 응답"
            else
              echo "헬스체크 실패. 이전 버전으로 롤백합니다."
              sudo systemctl stop tomcat
              sudo rm -rf /opt/tomcat/webapps/ROOT
              sudo cp "$BACKUP_FILE" /opt/tomcat/webapps/ROOT.war
              sudo chown tomcat:tomcat /opt/tomcat/webapps/ROOT.war
              sudo systemctl start tomcat
              exit 1
            fi
          '
