spring:
  application:
    name: shoppingmall-backend

  datasource:
    # infra 가이드 기준 db-01 = 192.168.10.10 / DB명 appdb
    url: jdbc:mysql://${DB_HOST:192.168.10.10}:3306/appdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # DB 정의서 기준으로 스키마가 이미 존재/관리되므로 자동 변경 금지.
      # 로컬에서 테이블을 아직 안 만들었다면 최초 1회만 'update'로 띄운 뒤 'validate'로 되돌릴 것.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080  # was-01 Tomcat 포트 (infra 가이드 5번 방화벽 규칙과 동일해야 함)
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256BIT}
  access-token-validity-ms: 3600000        # 1시간
  refresh-token-validity-ms: 1209600000    # 14일

file:
  # was-01 로컬 디스크 경로. 배포 시 충분한 용량이 있는 경로로 변경 (S3 도입 전까지 임시)
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  base-url: /uploads

payment:
  toss:
    # client-key 는 결제창을 띄우는 프론트에 그대로 노출되는 공개값이다.
    # secret-key 는 서버 전용 비밀값 -> 로컬은 application-local.yml(gitignore),
    # VM/클라우드는 반드시 환경변수로 주입할 것. VM 이미지 스냅샷에 파일째로 구워지면 시크릿이 유출된다.
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    # 토스가 결제 후 리다이렉트할 프론트 주소. 프론트에 빌드 스텝이 없어 값을 갈아끼울 수 없으므로
    # 서버가 GET /api/v1/payments/config 로 내려준다. 환경이 바뀌면 이 값만 바꾸면 된다.
    success-url: ${TOSS_SUCCESS_URL:http://192.168.10.12/payment-success.html}
    fail-url: ${TOSS_FAIL_URL:http://192.168.10.12/payment-fail.html}

logging:
  level:
    org.hibernate.SQL: debug
    com.shoppingmall: debug
